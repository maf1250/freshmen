<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة الإسناد الآلي للمستجدين (نظام الرزم)</title>   
    <!-- مكتبات قراءة وتصدير الملفات -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Cairo', sans-serif; box-sizing: border-box; }
        body { background-color: #f4f9f8; color: #333; margin: 0; padding: 40px 20px; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh;}
        
        .page { background-color: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); width: 100%; display: none; }
        .page.active { display: block; }
        
        #page-1 { max-width: 800px; }
        #page-2 { max-width: 900px; }
        #page-3 { max-width: 1200px; }
        
        h1 { text-align: center; color: #008e7e; font-size: 24px; margin-bottom: 20px; }
        .page-title { border-bottom: 2px dashed #008e7e; padding-bottom: 10px; margin-bottom: 20px; color: #006d60;}
        
        .upload-group { margin-bottom: 20px; background: #fafdfa; border: 2px dashed #8dc63f; padding: 15px; border-radius: 8px; text-align: right; }
        .upload-group label { display: flex; align-items: center; font-weight: 600; margin-bottom: 10px; color: #008e7e; gap: 8px; }
        input[type="file"] { display: block; width: 100%; font-family: inherit; margin-top: 10px; }        
        
        .advanced-settings { background: #eef7f6; border: 1px solid #cbe6e3; padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; transition: all 0.3s ease; }
        .advanced-settings summary { font-weight: 800; color: #006d60; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; outline: none; user-select: none; }
        .advanced-settings summary::-webkit-details-marker { display: none; }
        .advanced-settings summary::after { content: '▼'; font-size: 12px; transition: transform 0.3s ease; color: #008e7e; }
        .advanced-settings[open] summary::after { transform: rotate(180deg); }
        .settings-content { margin-top: 20px; border-top: 1px dashed #b2d8d3; padding-top: 20px; display: flex; flex-direction: column; gap: 25px; }
        .inner-group h3 { margin-top: 0; color: #006d60; font-size: 15px; text-align: center; margin-bottom: 15px; }     
        .settings-row { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; }
        .settings-row div { flex: 1; min-width: 150px; display: flex; flex-direction: column; align-items: center; }
        .settings-row label { font-weight: 600; margin-bottom: 8px; font-size: 12px; color: #006d60; }
        .settings-row input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; text-align: center; font-family: inherit; }
        .settings-row input:focus { outline: none; border-color: #008e7e; }
        
        .btn-process, .btn-action { background-color: #008e7e; color: #fff; border: none; padding: 12px 20px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 15px;}
        .btn-process:hover, .btn-action:hover { background-color: #006d60; }
        .btn-process:disabled { background-color: #a0c9c4; cursor: not-allowed; }
        .btn-secondary { background-color: #6c757d; }
        .btn-secondary:hover { background-color: #5a6268; }

        /* ستايل الرزم (الصفحة 2) */
        .packages-header { display: flex; align-items: center; justify-content: space-between; background: #eef7f6; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #cbe6e3;}
        .packages-header input { padding: 8px; border: 1px solid #008e7e; border-radius: 4px; width: 80px; text-align: center; font-family: inherit; font-weight: bold;}
        
        .packages-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .package-card { background: #fafdfa; border: 1px solid #8dc63f; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .package-card h3 { margin: 0 0 15px 0; color: #006d60; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #cbe6e3; padding-bottom: 8px;}
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; color: #333; margin-bottom: 5px; }
        .form-group select, .form-group input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; }
        .form-group input:focus, .form-group select:focus { border-color: #008e7e; outline: none; }
        
        /* التبويبات (الصفحة 3) */
        .tabs { display: flex; flex-wrap: wrap; gap: 5px; border-bottom: 2px solid #008e7e; margin-bottom: 20px; }
        .tab-btn { background: #eef7f6; border: 1px solid #cbe6e3; border-bottom: none; padding: 10px 15px; border-radius: 8px 8px 0 0; cursor: pointer; font-weight: 600; color: #006d60; transition: 0.3s; }
        .tab-btn:hover { background: #d8f0ed; }
        .tab-btn.active { background: #008e7e; color: #fff; }
        .tab-content { display: none; overflow-x: auto;}
        .tab-content.active { display: block; }

        /* الجداول */
        table.data-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; text-align: center; }
        table.data-table th, table.data-table td { border: 1px solid #e0e0e0; padding: 10px; }
        table.data-table th { background-color: #008e7e; color: #fff; position: sticky; top: 0; z-index: 1; }
        table.data-table tr:nth-child(even) { background-color: #f9f9f9; }
        table.data-table tr:hover { background-color: #f1f1f1; }
        
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-success { background: #d4edda; color: #155724; }
        .badge-warning { background: #fff3cd; color: #856404; }
        .badge-danger { background: #f8d7da; color: #721c24; }

        .btn-copy-rayat { background-color: #8dc63f; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.3s; display: inline-flex; align-items: center; gap: 8px; margin-bottom: 15px; }
        .btn-copy-rayat:hover { background-color: #74a629; }

        .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }

        #toast { visibility: hidden; min-width: 250px; background-color: #333; color: #fff; text-align: center; border-radius: 8px; padding: 16px; position: fixed; z-index: 1000; left: 50%; bottom: 30px; transform: translateX(-50%); font-size: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from { bottom: 0; opacity: 0; } to { bottom: 30px; opacity: 1; } }
        @keyframes fadeout { from { bottom: 30px; opacity: 1; } to { bottom: 0; opacity: 0; } }
        .loader { display: none; width: 20px; height: 20px; border: 3px solid #FFF; border-bottom-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .status-msg { text-align: center; margin-top: 15px; font-weight: bold; color: #dc3545; }
    </style>
</head>
<body>

    <!-- ==================== الصفحة الأولى: إعداد الملفات ==================== -->
    <div id="page-1" class="page active">
        <h1>إسناد جداول المستجدين (نظام الرزم)</h1>
        
        <details class="advanced-settings">
            <summary>⚙️ تخصيص أسماء الأعمدة (تعدل فقط عند الحاجة)</summary>
            <div class="settings-content">
                <div class="inner-group">
                    <h3>إعدادات ملف قائمة المستجدين (SP15)</h3>
                    <div class="settings-row">
                        <div><label>عمود رقم المتدرب</label><input type="text" id="col_sp15_id" value="رقم المتدرب"></div>
                        <div><label>عمود اسم المتدرب</label><input type="text" id="col_sp15_name" value="اسم المتدرب"></div>
                        <div><label>عمود التخصص/البرنامج</label><input type="text" id="col_sp15_program" value="وصف البرنامج"></div>
                    </div>
                </div>
                <div class="inner-group">
                    <h3>إعدادات تقرير الوحدة التدريبية (SS01)</h3>
                    <div class="settings-row">
                        <div><label>عمود الرقم المرجعي</label><input type="text" id="col_ss01_crn" value="الرقم المرجعي"></div>
                        <div><label>عمود المقرر</label><input type="text" id="col_ss01_course" value="المقرر"></div>
                    </div>
                </div>
            </div>
        </details>

        <div class="upload-group">
            <label>1. ملف قائمة المستجدين (SP15)</label>
            <input type="file" id="sp15File" accept=".xlsx, .xls, .csv">
        </div>

        <div class="upload-group">
            <label>2. تقرير جداول الوحدة التدريبية طولي (SS01)</label>
            <input type="file" id="ss01File" accept=".csv, .xlsx, .xls">
        </div>

        <div class="upload-group">
            <label>3. تقرير الشعب والشعب المرتبطة (SF33) - اختياري</label>
            <input type="file" id="sf33File" accept=".csv, .xlsx, .xls">
        </div>

        <button class="btn-process" onclick="goToPage2()">
            <span class="loader" id="loader-1"></span>
            <span id="btnText-1">التالي: إعداد وبناء الرزم</span>
        </button>
        <div id="status-1" class="status-msg"></div>
    </div>

    <!-- ==================== الصفحة الثانية: إعداد الرزم ==================== -->
    <div id="page-2" class="page">
        <h2 class="page-title">إعداد وتخصيص الرزم التدريبية</h2>
        
        <div class="packages-header">
            <div>
                <strong>حدد عدد الرزم المطلوب إنشاؤها:</strong>
            </div>
            <div>
                <input type="number" id="num-packages" min="1" max="50" value="1" onchange="generatePackageCards()">
            </div>
        </div>

        <div id="packages-container" class="packages-grid">
            <!-- سيتم توليد الرزم هنا عبر الجافاسكربت -->
        </div>

        <div style="display: flex; gap: 10px;">
            <button class="btn-action btn-secondary" onclick="switchPage('page-1')" style="flex: 1;">رجوع</button>
            <button class="btn-process" onclick="processAssignments()" style="flex: 3;">
                <span class="loader" id="loader-2"></span>
                <span id="btnText-2">تنفيذ الإسناد وعرض النتائج</span>
            </button>
        </div>
        <div id="status-2" class="status-msg"></div>
    </div>

    <!-- ==================== الصفحة الثالثة: النتائج ==================== -->
    <div id="page-3" class="page">
        <div class="header-actions">
            <h2 class="page-title" style="margin:0; border:none;">نتائج الإسناد الآلي</h2>
            <div style="display: flex; gap: 10px;">
                <button class="btn-action btn-secondary" onclick="switchPage('page-2')" style="width:auto; margin:0;">رجوع للإعدادات</button>
            </div>
        </div>

        <!-- التبويبات للأقسام -->
        <div class="tabs" id="results-tabs"></div>
        <div id="results-content-container"></div>
    </div>

    <div id="toast"></div>

<script>
    // متغيرات عامة لتخزين البيانات
    let traineesData = [];
    let uniquePrograms = [];
    let ss01Data = [];
    let assignmentResults = {}; // { programName: [trainees...], "Unassigned": [...] }

    // دوال قراءة الملفات
    function readExcelFile(file) {
        return new Promise((resolve, reject) => {
            if (!file) { resolve([]); return; }
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: "array" });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const json = XLSX.utils.sheet_to_json(sheet, { defval: "" });
                    
                    // تنظيف مفاتيح الـ JSON من المسافات الزائدة
                    let cleanedData = json.map(row => {
                        let newRow = {};
                        for (let key in row) {
                            newRow[key.trim()] = row[key];
                        }
                        return newRow;
                    });
                    resolve(cleanedData);
                } catch (err) { reject(err); }
            };
            reader.onerror = () => reject(new Error("خطأ في قراءة الملف"));
            reader.readAsArrayBuffer(file);
        });
    }

    // الانتقال للصفحة الثانية وقراءة الملفات
    async function goToPage2() {
        const sp15File = document.getElementById('sp15File').files[0];
        const ss01File = document.getElementById('ss01File').files[0];
        const status = document.getElementById('status-1');
        
        if (!sp15File) {
            status.innerText = 'الرجاء إرفاق ملف قائمة المستجدين (SP15)';
            return;
        }

        document.getElementById('loader-1').style.display = 'inline-block';
        document.getElementById('btnText-1').innerText = 'جارِ المعالجة...';
        status.innerText = '';

        try {
            const colId = document.getElementById('col_sp15_id').value.trim();
            const colName = document.getElementById('col_sp15_name').value.trim();
            const colProgram = document.getElementById('col_sp15_program').value.trim();

            let rawSP15 = await readExcelFile(sp15File);
            
            // استخراج المتدربين والبرامج
            traineesData = [];
            let programsSet = new Set();
            
            rawSP15.forEach(row => {
                let id = row[colId];
                let name = row[colName];
                let prog = row[colProgram];
                
                if (id) {
                    traineesData.push({ id: String(id).trim(), name: name || '', program: (prog || 'غير محدد').trim() });
                    if (prog) programsSet.add(prog.trim());
                }
            });

            uniquePrograms = Array.from(programsSet).sort();
            
            if (traineesData.length === 0) {
                throw new Error(`لم يتم العثور على بيانات. تأكد من تطابق اسم عمود "رقم المتدرب".`);
            }

            // قراءة ملف الجدول إذا تم إرفاقه (للتحقق مستقبلاً إذا أردت)
            ss01Data = await readExcelFile(ss01File); 

            generatePackageCards();
            switchPage('page-2');

        } catch (error) {
            status.innerText = error.message;
        } finally {
            document.getElementById('loader-1').style.display = 'none';
            document.getElementById('btnText-1').innerText = 'التالي: إعداد وبناء الرزم';
        }
    }

    // توليد واجهة الرزم
    function generatePackageCards() {
        const num = parseInt(document.getElementById('num-packages').value) || 1;
        const container = document.getElementById('packages-container');
        container.innerHTML = '';

        let programOptions = uniquePrograms.map(p => `<option value="${p}">${p}</option>`).join('');

        for (let i = 1; i <= num; i++) {
            let card = document.createElement('div');
            card.className = 'package-card';
            card.innerHTML = `
                <h3>رزمة رقم ${i} <span style="font-size:12px; background:#008e7e; color:#fff; padding:2px 8px; border-radius:10px;">جديد</span></h3>
                <div class="form-group">
                    <label>القسم / التخصص المستهدف:</label>
                    <select id="pkg-program-${i}">
                        <option value="">-- اختر التخصص --</option>
                        ${programOptions}
                    </select>
                </div>
                <div class="form-group">
                    <label>السعة القصوى للمتدربين:</label>
                    <input type="number" id="pkg-capacity-${i}" min="1" value="30">
                </div>
                <div class="form-group">
                    <label>الأرقام المرجعية (CRNs): <small style="color:#666; font-weight:normal;">(افصل بينها بمسافة أو فاصلة)</small></label>
                    <input type="text" id="pkg-crns-${i}" placeholder="مثال: 12345, 12346, 12347">
                </div>
            `;
            container.appendChild(card);
        }
    }

    // تنفيذ عملية الإسناد
    function processAssignments() {
        const num = parseInt(document.getElementById('num-packages').value) || 1;
        const status = document.getElementById('status-2');
        
        let packages = [];
        for (let i = 1; i <= num; i++) {
            let prog = document.getElementById(`pkg-program-${i}`).value;
            let cap = parseInt(document.getElementById(`pkg-capacity-${i}`).value) || 0;
            let crnsRaw = document.getElementById(`pkg-crns-${i}`).value;
            
            if (!prog || !crnsRaw) {
                status.innerText = `الرجاء استكمال بيانات الرزمة رقم ${i} (التخصص والأرقام المرجعية).`;
                return;
            }

            // تنظيف الأرقام المرجعية
            let crns = crnsRaw.split(/[\s,،]+/).filter(c => c.trim() !== "");
            
            packages.push({
                id: i,
                program: prog,
                maxCapacity: cap,
                currentCount: 0,
                crns: crns
            });
        }

        document.getElementById('loader-2').style.display = 'inline-block';
        document.getElementById('btnText-2').innerText = 'جارِ التوزيع...';
        status.innerText = '';

        // تهيئة النتائج
        assignmentResults = {};
        uniquePrograms.forEach(p => assignmentResults[p] = []);
        assignmentResults['غير مسند'] = [];

        // خوارزمية التوزيع
        traineesData.forEach(trainee => {
            let assigned = false;
            let progPackages = packages.filter(p => p.program === trainee.program);

            for (let pkg of progPackages) {
                if (pkg.currentCount < pkg.maxCapacity) {
                    pkg.currentCount++;
                    trainee.assignedPackage = pkg.id;
                    trainee.assignedCRNs = pkg.crns;
                    assignmentResults[trainee.program].push(trainee);
                    assigned = true;
                    break;
                }
            }

            if (!assigned) {
                trainee.assignedPackage = null;
                trainee.assignedCRNs = [];
                assignmentResults['غير مسند'].push(trainee);
            }
        });

        // بناء صفحة النتائج
        buildResultsUI(packages);
        
        document.getElementById('loader-2').style.display = 'none';
        document.getElementById('btnText-2').innerText = 'تنفيذ الإسناد وعرض النتائج';
        switchPage('page-3');
    }

    // بناء وعرض الجداول في الصفحة 3
    function buildResultsUI(packages) {
        const tabsContainer = document.getElementById('results-tabs');
        const contentContainer = document.getElementById('results-content-container');
        
        tabsContainer.innerHTML = '';
        contentContainer.innerHTML = '';

        let isFirst = true;

        for (let prog in assignmentResults) {
            let students = assignmentResults[prog];
            if (students.length === 0) continue;

            // بناء التبويب
            let tabId = `tab-${prog.replace(/\s/g, '-')}`;
            let btn = document.createElement('button');
            btn.className = `tab-btn ${isFirst ? 'active' : ''}`;
            btn.innerText = prog + ` (${students.length})`;
            btn.onclick = () => activateTab(tabId, btn);
            tabsContainer.appendChild(btn);

            // بناء المحتوى
            let contentDiv = document.createElement('div');
            contentDiv.id = tabId;
            contentDiv.className = `tab-content ${isFirst ? 'active' : ''}`;
            isFirst = false;

            // زر النسخ للقسم
            let copyBtn = document.createElement('button');
            copyBtn.className = 'btn-copy-rayat';
            copyBtn.innerHTML = `📋 نسخ بيانات هذا القسم لرايات أوتو`;
            copyBtn.onclick = () => copyToRayatAuto(students);
            
            // ملخص الرزم لهذا القسم
            let summaryHTML = '';
            if (prog !== 'غير مسند') {
                let progPkgs = packages.filter(p => p.program === prog);
                summaryHTML = `<div style="display:flex; gap:10px; margin-bottom:15px; flex-wrap:wrap;">`;
                progPkgs.forEach(p => {
                    let isFull = p.currentCount >= p.maxCapacity;
                    let color = isFull ? '#dc3545' : '#008e7e';
                    summaryHTML += `<div style="background:#fff; border:1px solid ${color}; padding:10px; border-radius:6px; font-size:13px; font-weight:bold;">
                        رزمة ${p.id}: مستخدم ${p.currentCount} من ${p.maxCapacity}
                    </div>`;
                });
                summaryHTML += `</div>`;
            }

            // الجدول
            let tableHTML = `
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>رقم المتدرب</th>
                            <th>اسم المتدرب</th>
                            <th>الرزمة المخصصة</th>
                            <th>الأرقام المرجعية للجدول</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            students.forEach(st => {
                let pkgText = st.assignedPackage ? `رزمة ${st.assignedPackage}` : `<span class="badge badge-danger">لم يسند (السعة ممتلئة)</span>`;
                let crnsText = st.assignedCRNs.length > 0 ? 
                    st.assignedCRNs.map(c => `<span class="badge badge-success">${c}</span>`).join(' ') 
                    : '-';

                tableHTML += `
                    <tr>
                        <td>${st.id}</td>
                        <td>${st.name}</td>
                        <td>${pkgText}</td>
                        <td>${crnsText}</td>
                    </tr>
                `;
            });
            tableHTML += `</tbody></table>`;

            contentDiv.innerHTML = summaryHTML;
            if(prog !== 'غير مسند') contentDiv.insertBefore(copyBtn, contentDiv.firstChild);
            contentDiv.innerHTML += tableHTML;
            
            contentContainer.appendChild(contentDiv);
        }
    }

    // دالة نسخ البيانات لرايات أوتو (رقم المتدرب + tab + CRNs)
    function copyToRayatAuto(students) {
        let textToCopy = "";
        
        students.forEach(st => {
            if (st.assignedCRNs && st.assignedCRNs.length > 0) {
                // دمج رقم المتدرب مع الأرقام المرجعية مفصولة بـ Tab
                let line = st.id + '\t' + st.assignedCRNs.join('\t');
                textToCopy += line + '\n';
            }
        });

        if (textToCopy.trim() === "") {
            showToast('لا توجد بيانات لنسخها في هذا القسم!');
            return;
        }

        navigator.clipboard.writeText(textToCopy.trim()).then(() => {
            showToast('✅ تم نسخ البيانات لرايات أوتو بنجاح!');
        }).catch(err => {
            console.error('فشل النسخ: ', err);
            showToast('❌ حدث خطأ أثناء النسخ');
        });
    }

    // التبديل بين التبويبات
    function activateTab(tabId, btnElement) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
        btnElement.classList.add('active');
        document.getElementById(tabId).classList.add('active');
    }

    // التبديل بين الصفحات
    function switchPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
    }

    // عرض التنبيهات المنبثقة
    function showToast(message) {
        let toast = document.getElementById("toast");
        toast.innerText = message;
        toast.className = "show";
        setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
    }
</script>

</body>
</html>
